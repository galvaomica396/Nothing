name: Build Windows Tauri

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload verified Windows setup and portable assets to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Prerelease tag to create/update when publish_release is true"
        required: false
        type: string
        default: "windows-stabilization-test"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install frontend deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Python compile check
        shell: pwsh
        run: |
          $files = @("document_masker_ocr_gui.py", "masking_context.py", "privacy_detection.py")
          $files += Get-ChildItem -Path "scripts" -Filter "*.py" | ForEach-Object { $_.FullName }
          python -m py_compile @files

      - name: Runtime contract diagnostic
        shell: pwsh
        continue-on-error: true
        run: |
          node scripts/check_runtime_contract.mjs
          $exitCode = $LASTEXITCODE
          Write-Host "runtime contract exit code: $exitCode"
          exit $exitCode

      - name: Python tests
        run: python -m pytest

      - name: Build packaged Python masking engine
        shell: pwsh
        run: ./scripts/build_masking_engine.ps1

      - name: Windows smoke test
        shell: pwsh
        run: ./scripts/e2e_windows_smoke.ps1

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Windows app
        run: npm run tauri build

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $outDir = "release-windows"
          $portableDir = Join-Path $outDir "portable"
          $releaseRoot = "src-tauri/target/release"
          $portableExeName = "Nothing-4.7.3-windows-x64.exe"
          $installerName = "Nothing-4.7.3-windows-x64-setup.exe"
          $portableZipName = "Nothing-4.7.3-windows-x64-portable.zip"
          $manifestName = "Nothing-4.7.3-windows-x64-manifest.json"
          $licenseFiles = @(
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "LICENSE-APACHE-2.0.txt"
          )
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          if (!(Test-Path "masking_runtime/bin/masking_engine.exe")) { throw "missing packaged masking_engine.exe" }
          if (!(Test-Path "data/kr_regions.json")) { throw "missing active region data" }
          if (!(Test-Path "data/kr_regions.seed.json")) { throw "missing seed region data" }

          $appExe = Join-Path $releaseRoot "tauri_frontend.exe"
          if (!(Test-Path $appExe)) {
            $appExe = (Get-ChildItem -Path $releaseRoot -Filter "*.exe" -File | Select-Object -First 1).FullName
          }
          if (!$appExe -or !(Test-Path $appExe)) { throw "missing Tauri Windows exe" }

          $resourceCandidates = @(
            (Join-Path $releaseRoot "resources"),
            $releaseRoot
          )
          $resourceRoot = ""
          foreach ($candidate in $resourceCandidates) {
            if (Test-Path (Join-Path $candidate "masking_runtime\data\kr_regions.json")) {
              $resourceRoot = $candidate
              break
            }
          }
          if ($resourceRoot -eq "") { throw "missing Tauri masking_runtime resources" }
          foreach ($licenseFile in $licenseFiles) {
            $resourceLicensePath = Join-Path $resourceRoot "licenses\$licenseFile"
            if (!(Test-Path $resourceLicensePath)) {
              throw "Tauri resources missing license file: licenses\$licenseFile"
            }
          }

          $bundleRoot = Join-Path $releaseRoot "bundle"
          if (Test-Path $bundleRoot) {
            Copy-Item $bundleRoot "$outDir/bundle" -Recurse -Force
          }
          $nsisRoot = Join-Path $bundleRoot "nsis"
          $installerExe = ""
          if (Test-Path $nsisRoot) {
            $installerExe = (Get-ChildItem -Path $nsisRoot -Filter "*.exe" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          }
          if (!$installerExe -or !(Test-Path $installerExe)) { throw "missing Tauri NSIS installer under bundle/nsis" }
          $installerListing = (& 7z l -ba $installerExe | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "unable to inspect Tauri NSIS installer" }
          foreach ($licenseFile in $licenseFiles) {
            if ($installerListing -notmatch [regex]::Escape($licenseFile)) {
              throw "Windows installer missing bundled license file: $licenseFile"
            }
          }

          Copy-Item $appExe "$portableDir/$portableExeName" -Force
          Copy-Item $installerExe "$outDir/$installerName" -Force
          Copy-Item (Join-Path $resourceRoot "masking_runtime") "$portableDir/masking_runtime" -Recurse -Force
          Copy-Item (Join-Path $resourceRoot "licenses") "$portableDir/licenses" -Recurse -Force

          $requiredPortableFiles = @(
            $portableExeName,
            "masking_runtime\bin\masking_engine.exe",
            "masking_runtime\data\kr_regions.json",
            "masking_runtime\data\kr_regions.seed.json",
            "masking_runtime\document_masker_ocr_gui.py",
            "masking_runtime\masking_context.py",
            "masking_runtime\privacy_detection.py",
            "masking_runtime\privacy_false_positive.py",
            "masking_runtime\privacy_spans.py",
            "masking_runtime\privacy_transformers.py",
            "masking_runtime\requirements.txt",
            "licenses\LICENSE",
            "licenses\THIRD_PARTY_NOTICES.md",
            "licenses\LICENSE-APACHE-2.0.txt",
            "masking_runtime\tauri_frontend\scripts\run_masking_pipeline.py",
            "masking_runtime\tauri_frontend\scripts\apply_manual_boxes.py"
          )
          foreach ($required in $requiredPortableFiles) {
            if (!(Test-Path (Join-Path $portableDir $required))) {
              throw "portable release package missing required file: $required"
            }
          }

          $portableZipPath = Join-Path $outDir $portableZipName
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZipPath -Force
          $portableZipListing = (& 7z l -ba $portableZipPath | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "unable to inspect Windows portable zip" }
          foreach ($licenseFile in $licenseFiles) {
            if ($portableZipListing -notmatch [regex]::Escape($licenseFile)) {
              throw "Windows portable zip missing license file: $licenseFile"
            }
          }

          $portableRoot = (Resolve-Path $portableDir).Path
          $portableFiles = Get-ChildItem -Path $portableDir -File -Recurse | Sort-Object FullName
          $installerPath = Join-Path $outDir $installerName
          $installerFile = Get-Item $installerPath
          $portableZipFile = Get-Item $portableZipPath
          $manifest = [ordered]@{
            artifact_name = "Nothing-4.7.3-windows-x64"
            app_version = "4.7.3"
            os = "windows-x64"
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            github_sha = $env:GITHUB_SHA
            github_ref = $env:GITHUB_REF
            github_ref_name = $env:GITHUB_REF_NAME
            release_assets = @(
              [ordered]@{
                name = $installerName
                kind = "installer"
                bytes = $installerFile.Length
                sha256 = (Get-FileHash -Path $installerFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              },
              [ordered]@{
                name = $portableZipName
                kind = "portable_zip"
                bytes = $portableZipFile.Length
                sha256 = (Get-FileHash -Path $portableZipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            )
            required_portable_files = $requiredPortableFiles
            installer_license_files = @($licenseFiles | ForEach-Object { "licenses/$_" })
            portable_files = @($portableFiles | ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($portableRoot.Length + 1).Replace("\", "/")
                bytes = $_.Length
                sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
          }
          $manifestPath = Join-Path $outDir $manifestName
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8
          $portableZipHash = (Get-FileHash -Path $portableZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "::group::Release package manifest"
          Get-Content -Path $manifestPath -Raw
          Write-Host "installer_path=$installerName"
          Write-Host "installer_sha256=$installerHash"
          Write-Host "portable_zip_path=$portableZipName"
          Write-Host "portable_zip_sha256=$portableZipHash"
          Write-Host "::endgroup::"

      - name: Windows packaged desktop launch smoke
        shell: pwsh
        run: ./scripts/e2e_windows_desktop_smoke.ps1 -ReleaseDir release-windows/portable -InstallerPath release-windows/Nothing-4.7.3-windows-x64-setup.exe

      - name: Upload Windows release assets to GitHub Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "release_tag is required when publish_release is true" }

          $installerPath = "release-windows/Nothing-4.7.3-windows-x64-setup.exe"
          $portableZipPath = "release-windows/Nothing-4.7.3-windows-x64-portable.zip"
          $manifestPath = "release-windows/Nothing-4.7.3-windows-x64-manifest.json"
          if (!(Test-Path $installerPath)) { throw "missing Windows installer: $installerPath" }
          if (!(Test-Path $portableZipPath)) { throw "missing Windows portable zip: $portableZipPath" }
          if (!(Test-Path $manifestPath)) { throw "missing release manifest: $manifestPath" }

          $title = "Nothing Windows release $tag"
          $notes = @(
            "Automated prerelease from ref $env:GITHUB_REF_NAME at commit $env:GITHUB_SHA.",
            "",
            "This release is intended for Windows desktop verification.",
            "Download the setup exe for normal installation, or the portable zip for no-install testing.",
            "The old full bundle zip is intentionally not uploaded to keep downloads smaller."
          ) -join [Environment]::NewLine

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
          }
          gh release upload $tag $installerPath $portableZipPath $manifestPath --repo $env:GITHUB_REPOSITORY --clobber

      - name: Windows release asset roundtrip smoke
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "release_tag is required when publish_release is true" }

          $roundTripRoot = "release-roundtrip"
          $extractDir = Join-Path $roundTripRoot "extracted"
          Remove-Item $roundTripRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $roundTripRoot | Out-Null

          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "Nothing-4.7.3-windows-x64-portable.zip" --dir $roundTripRoot --clobber
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "Nothing-4.7.3-windows-x64-setup.exe" --dir $roundTripRoot --clobber
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "Nothing-4.7.3-windows-x64-manifest.json" --dir $roundTripRoot --clobber

          $zipPath = Join-Path $roundTripRoot "Nothing-4.7.3-windows-x64-portable.zip"
          $installerPath = Join-Path $roundTripRoot "Nothing-4.7.3-windows-x64-setup.exe"
          $manifestPath = Join-Path $roundTripRoot "Nothing-4.7.3-windows-x64-manifest.json"
          if (!(Test-Path $zipPath)) { throw "missing downloaded Windows portable zip: $zipPath" }
          if (!(Test-Path $installerPath)) { throw "missing downloaded Windows installer: $installerPath" }
          if (!(Test-Path $manifestPath)) { throw "missing downloaded Windows manifest: $manifestPath" }

          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $requiredLicenseFiles = @(
            "licenses\LICENSE",
            "licenses\THIRD_PARTY_NOTICES.md",
            "licenses\LICENSE-APACHE-2.0.txt"
          )
          foreach ($required in $requiredLicenseFiles) {
            if (!(Test-Path (Join-Path $extractDir $required))) {
              throw "downloaded Windows portable zip missing license file: $required"
            }
          }
          $installerListing = (& 7z l -ba $installerPath | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "unable to inspect downloaded Windows installer" }
          foreach ($required in $requiredLicenseFiles) {
            $licenseFile = Split-Path $required -Leaf
            if ($installerListing -notmatch [regex]::Escape($licenseFile)) {
              throw "downloaded Windows installer missing license file: $licenseFile"
            }
          }
          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          foreach ($required in $requiredLicenseFiles) {
            $manifestPathValue = $required.Replace("\", "/")
            if ($manifest.required_portable_files -notcontains $required) {
              throw "downloaded Windows manifest missing portable license file: $required"
            }
            if ($manifest.installer_license_files -notcontains $manifestPathValue) {
              throw "downloaded Windows manifest missing installer license file: $manifestPathValue"
            }
          }
          ./scripts/e2e_windows_desktop_smoke.ps1 -ReleaseDir $extractDir -InstallerPath $installerPath

      - name: Upload Windows release asset artifact
        continue-on-error: ${{ inputs.publish_release }}
        uses: actions/upload-artifact@v7
        with:
          name: Nothing-4.7.3-windows-x64-release-assets
          path: release-windows
          retention-days: 7
